<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Keyboard-visible current and proposed hierarchy</title><desc id="desc">Conceptual UX comparison at 568 by 1232 logical pixels.</desc><style>.bg{fill:#111827}.bar{fill:#245f7a}.card{fill:#24495a}.key{fill:#242424}.white{fill:#f8fafc}.muted{fill:#cbd5e1}.note{fill:#e2e8f0;font:18px sans-serif}.head{fill:#f8fafc;font:700 28px sans-serif}.label{fill:#f8fafc;font:22px sans-serif}.small{fill:#cbd5e1;font:16px sans-serif}.line{stroke:#67e8f9;stroke-width:2;fill:none}</style><rect width="1400" height="820" fill="#0b1220"/><text x="40" y="48" class="head">Keyboard-visible: current schematic and proposed retained navigation</text><text x="40" y="76" class="note">Current follows 2026-09-23 native keyboard capture. Proposed hierarchy is not shipped.</text>
