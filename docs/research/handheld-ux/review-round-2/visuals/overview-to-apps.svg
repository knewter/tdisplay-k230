<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620">
<defs><style>text{font-family:DejaVu Sans,Arial,sans-serif}.title{font-size:27px;font-weight:700;fill:#202331}.sub{font-size:15px;fill:#44495c}.head{font-size:18px;font-weight:700;fill:#202331}.body{font-size:14px;fill:#34394c}.box{fill:#fff;stroke:#bbc1d0;stroke-width:1.5}.state{font-size:12px;font-weight:700;letter-spacing:.6px}</style></defs>
<rect width="1040" height="620" fill="#f4f5f8"/><text x="28" y="40" class="title">Schematic: three accepted navigation checks</text><text x="28" y="68" class="sub">Diagrams summarize accepted endpoints; no per-action capture is supplied.</text>
<g>
<rect x="28" y="112" width="220" height="355" rx="14" class="box"/><text x="46" y="145" class="head">1 · Home</text><rect x="48" y="166" width="180" height="230" rx="14" fill="#bd5b95"/><text x="64" y="205" fill="#fff" font-size="14">Home</text><g fill="#34374b"><rect x="67" y="222" width="35" height="35" rx="8"/><rect x="115" y="222" width="35" height="35" rx="8"/><rect x="163" y="222" width="35" height="35" rx="8"/></g><rect x="48" y="361" width="180" height="35" rx="10" fill="#252637"/><text x="48" y="426" class="body" font-size="11">Tap handle → Overview</text><text x="48" y="447" class="state" fill="#9b6b00" font-size="10">FINGER ACCEPTED</text>
<rect x="282" y="112" width="220" height="355" rx="14" class="box"/><text x="300" y="145" class="head" font-size="16">2 · Overview</text><rect x="302" y="166" width="180" height="230" rx="14" fill="#eef0f5"/><text x="317" y="193" fill="#515974" font-size="13">Overview</text><rect x="329" y="211" width="126" height="165" rx="16" fill="#171b29"/><text x="342" y="235" fill="#e1e6fa" font-size="11">live app card</text><text x="302" y="426" class="body" font-size="11">Terminal open / return</text><text x="302" y="447" class="state" fill="#9b6b00" font-size="10">FINGER ACCEPTED</text>
<rect x="536" y="112" width="220" height="355" rx="14" class="box"/><text x="554" y="145" class="head">3 · Apps</text><rect x="556" y="166" width="180" height="230" rx="14" fill="#1b1b29"/><rect x="569" y="183" width="154" height="22" rx="11" fill="#303241"/><text x="580" y="198" fill="#cbd1ef" font-size="10">Search apps</text><g fill="#59627e"><rect x="577" y="220" width="28" height="28" rx="6"/><rect x="621" y="220" width="28" height="28" rx="6"/><rect x="665" y="220" width="28" height="28" rx="6"/></g><text x="554" y="426" class="body" font-size="11">Drag up from Home</text><text x="554" y="447" class="state" fill="#9b6b00" font-size="10">FINGER ACCEPTED</text>
<rect x="790" y="112" width="220" height="355" rx="14" class="box"/><text x="808" y="145" class="head">4 · Terminal</text><rect x="810" y="166" width="180" height="230" rx="14" fill="#171b29"/><text x="826" y="193" fill="#c6efb9" font-family="monospace" font-size="11">shell@nixos:~$</text><text x="808" y="426" class="body" font-size="11">Open / return to Terminal</text><text x="808" y="447" class="state" fill="#9b6b00" font-size="10">FINGER ACCEPTED</text>
</g>

<rect x="28" y="500" width="982" height="80" rx="10" fill="#fff2cf" stroke="#e6c66b"/><text x="48" y="531" class="body">Operator accepted these three real-finger checks on the exact p1a1hz / 3hy6 candidate during manual boot.</text><text x="48" y="554" class="body">No Home-edit or ordinary-boot gesture replay. No new footage. Long-press stays grab/drag; app menu is mouse secondary click.</text>
