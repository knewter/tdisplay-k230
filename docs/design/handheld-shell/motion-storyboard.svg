<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-label="Proposed app to card to adjacent card motion, with recoverable throw">
<defs><style>.bg{fill:#0a1017}.screen{fill:#101822;stroke:#42616b;stroke-width:2}.app{fill:#263946;stroke:#78d7cb;stroke-width:2}.other{fill:#263946}.copy{fill:#f4f7f8;font:14px sans-serif}.small{fill:#c8d7dd;font:11px sans-serif}.title{fill:#f4f7f8;font:700 21px sans-serif}.move{stroke:#78d7cb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><clipPath id="clip"><rect width="190" height="300" rx="16"/></clipPath></defs>
<rect width="1080" height="440" class="bg"/><text x="20" y="32" class="title">ONE SCENE / SAME LIVE APP / INTERRUPTIBLE MOTION</text><text x="20" y="53" class="small">Proposed positions, not captured frames or measured timing</text>
<g transform="translate(20 80)"><rect width="190" height="300" rx="16" class="screen"/><rect x="10" y="10" width="170" height="32" rx="7" class="other"/><text x="20" y="30" class="small">APP · TERMINAL</text><rect x="10" y="50" width="170" height="240" rx="9" class="app"/><text x="25" y="75" class="small">$ live content</text><path d="M95 266v-73m-8 9 8-9 8 9" class="move"/><text x="5" y="323" class="copy">1 · bottom Home drag</text></g>
<path d="M218 224h38m-9-9 9 9-9 9" class="move"/>
<g transform="translate(270 80)"><rect width="190" height="300" rx="16" class="screen"/><g clip-path="url(#clip)"><rect x="26" y="75" width="138" height="182" rx="13" class="app"/><rect x="173" y="91" width="100" height="150" rx="13" class="other"/></g><text x="38" y="100" class="small">same live app</text><path d="M95 265v-65m-8 9 8-9 8 9" class="move"/><text x="5" y="323" class="copy">2 · shrink follows finger</text></g>
<path d="M468 224h38m-9-9 9 9-9 9" class="move"/>
<g transform="translate(520 80)"><rect width="190" height="300" rx="16" class="screen"/><g clip-path="url(#clip)"><rect x="-82" y="75" width="138" height="182" rx="13" class="app"/><rect x="67" y="75" width="138" height="182" rx="13" class="other"/></g><text x="80" y="100" class="small">adjacent app</text><path d="M141 263H65m9-8-9 8 9 8" class="move"/><text x="5" y="323" class="copy">3 · drag then snap</text></g>
<path d="M718 224h38m-9-9 9 9-9 9" class="move"/>
<g transform="translate(770 80)"><rect width="190" height="300" rx="16" class="screen"/><rect x="26" y="75" width="138" height="182" rx="13" class="app"/><path d="M95 207v-75m-8 9 8-9 8 9" class="move"/><rect x="26" y="260" width="138" height="29" rx="8" class="other"/><text x="34" y="279" class="small">REFUSED · RETURN</text><text x="5" y="323" class="copy">4 · throw / recovery</text></g>
<text x="20" y="420" class="small">Back, new drag, app unmap or notice retargets current geometry; no start-frame jump, blank frame, focus orphan or private-pixel substitution.</text>
</svg>
