<svg xmlns="http://www.w3.org/2000/svg" width="1844" height="735" viewBox="0 0 1844 735" role="img" aria-label="Proposed gesture shell: app, live-card Home, installed-app drawer, notification shade, Settings and keyboard">
<defs><style>.bg{fill:#0a1017}.phone{fill:#101822}.surface{fill:#1b2934}.card{fill:#263946}.text{fill:#f4f7f8}.muted{fill:#c8d7dd}.teal{fill:#78d7cb}.amber{fill:#ffc27a}.line{stroke:#78d7cb;stroke-width:2;fill:none}.title{font:700 20px sans-serif;fill:#f4f7f8}.head{font:700 16px sans-serif;fill:#f4f7f8}.body{font:13px sans-serif;fill:#f4f7f8}.hint{font:11px sans-serif;fill:#c8d7dd}.tiny{font:9px sans-serif;fill:#c8d7dd}.icon{font:700 13px sans-serif;fill:#101822}</style>
<g id="frame"><rect width="284" height="616" rx="24" class="phone"/><rect x="125" y="10" width="34" height="4" rx="2" class="muted"/><rect x="111" y="596" width="62" height="5" rx="3" class="teal"/></g>
<g id="terminal-icon"><rect width="30" height="30" rx="9" class="teal"/><text x="7" y="20" class="icon">&gt;_</text></g>
<g id="monitor-icon"><rect width="30" height="30" rx="9" class="amber"/><rect x="7" y="15" width="4" height="8" class="phone"/><rect x="13" y="10" width="4" height="13" class="phone"/><rect x="19" y="6" width="4" height="17" class="phone"/></g>
<g id="video-icon"><rect width="30" height="30" rx="9" class="teal"/><path d="M11 7v16l13-8z" fill="#101822"/></g>
<clipPath id="deck-screen"><rect width="284" height="616" rx="24"/></clipPath><clipPath id="drawer-clip"><rect x="0" y="100" width="284" height="482"/></clipPath>
</defs>
<rect width="1844" height="735" class="bg"/><text x="20" y="34" class="title">HANDHELD / GESTURE SCENE</text><text x="20" y="56" class="hint">Proposed 568×1232 logical pixels at 50% · no permanent navigation buttons · not installed or physically verified</text>
<g transform="translate(20 82)"><use href="#frame"/><text x="18" y="48" class="title">Terminal</text><use href="#terminal-icon" x="234" y="27"/><rect x="17" y="73" width="250" height="500" rx="14" class="surface"/><text x="34" y="111" class="body">$ systemctl status shell</text><text x="34" y="135" class="hint">● active (running)</text><text x="34" y="520" class="hint">App keeps ordinary scroll and selection</text><path d="M242 577v-35m-7 8 7-8 7 8" class="line"/><text x="35" y="555" class="tiny">BOTTOM SWIPE → LIVE CARDS</text></g>
<g transform="translate(324 82)"><use href="#frame"/><text x="18" y="50" class="title">Cards</text><text x="18" y="70" class="hint">Home · live running apps</text><g clip-path="url(#deck-screen)"><rect x="244" y="139" width="110" height="322" rx="18" class="card"/><rect x="18" y="122" width="208" height="356" rx="18" class="card" stroke="#78d7cb" stroke-width="2"/><rect x="31" y="135" width="182" height="266" rx="10" fill="#172b36"/><text x="43" y="163" class="tiny">$ active live content</text></g><use href="#terminal-icon" x="34" y="414"/><text x="73" y="434" class="head">Terminal</text><text x="34" y="461" class="hint">Swipe cards · tap to expand</text><text x="28" y="509" class="hint">Pull upward to open apps</text><path d="M141 568v-43m-7 8 7-8 7 8" class="line"/><text x="77" y="586" class="tiny">DRAWER</text></g>
<g transform="translate(628 82)"><use href="#frame"/><rect x="8" y="54" width="268" height="528" rx="21" class="surface"/><rect x="113" y="65" width="58" height="4" rx="2" class="teal"/><text x="20" y="103" class="title">Apps</text><text x="20" y="123" class="hint">Installed · scroll · hold for actions</text><g clip-path="url(#drawer-clip)"><rect x="18" y="144" width="248" height="86" rx="15" class="card"/><use href="#terminal-icon" x="34" y="169"/><text x="76" y="183" class="head">Terminal</text><text x="76" y="204" class="hint">Open a window</text><rect x="18" y="242" width="248" height="86" rx="15" class="card"/><use href="#monitor-icon" x="34" y="267"/><text x="76" y="281" class="head">Monitor</text><text x="76" y="302" class="hint">See system activity</text><rect x="18" y="340" width="248" height="86" rx="15" class="card"/><use href="#video-icon" x="34" y="365"/><text x="76" y="379" class="head">Video</text><text x="76" y="400" class="hint">Play media</text><rect x="18" y="438" width="248" height="86" rx="15" class="card"/><circle cx="49" cy="479" r="15" class="amber"/><text x="45" y="485" class="icon">?</text><text x="76" y="477" class="head">Help</text><text x="76" y="498" class="hint">Gestures and accessibility</text><rect x="18" y="536" width="248" height="86" rx="15" class="card"/><text x="76" y="575" class="head">More apps below</text></g></g>
<g transform="translate(932 82)"><use href="#frame"/><rect x="0" y="0" width="284" height="567" rx="23" class="surface"/><rect x="113" y="9" width="58" height="4" rx="2" class="teal"/><text x="18" y="53" class="title">Notifications</text><text x="18" y="74" class="hint">Pulled down over the current app</text><rect x="18" y="92" width="248" height="62" rx="14" class="card"/><circle cx="49" cy="123" r="15" class="teal"/><text x="44" y="129" class="icon">⚙</text><text x="77" y="127" class="head">Settings</text><text x="223" y="128" class="hint">›</text><rect x="18" y="169" width="248" height="95" rx="15" class="card"/><rect x="29" y="181" width="5" height="68" rx="2" class="amber"/><text x="46" y="198" class="head">Network</text><text x="46" y="221" class="hint">Connection needs attention</text><text x="46" y="246" class="tiny">TAP TO OPEN · SWIPE SIDEWAYS</text><rect x="18" y="276" width="248" height="95" rx="15" class="card"/><rect x="29" y="288" width="5" height="68" rx="2" class="teal"/><use href="#video-icon" x="43" y="289"/><text x="83" y="305" class="head">Video</text><text x="83" y="328" class="hint">Playback finished · details hidden</text><text x="46" y="353" class="tiny">HISTORY RETAINS THIS EVENT</text><text x="18" y="418" class="hint">Drag list to scroll</text><text x="18" y="445" class="hint">Swipe inward to return to your task</text></g>
<g transform="translate(1236 82)"><use href="#frame"/><text x="18" y="50" class="title">Settings</text><text x="18" y="72" class="hint">From notification shade</text><rect x="18" y="100" width="248" height="82" rx="15" class="card"/><text x="34" y="131" class="head">Network</text><text x="34" y="156" class="hint">Status unavailable · Open setup</text><rect x="18" y="194" width="248" height="82" rx="15" class="card"/><text x="34" y="225" class="head">Display</text><text x="34" y="250" class="hint">Brightness unavailable</text><rect x="18" y="288" width="248" height="82" rx="15" class="card"/><text x="34" y="319" class="head">Motion</text><text x="34" y="344" class="hint">Reduced motion [ ON ]</text><rect x="18" y="382" width="248" height="82" rx="15" class="card"/><text x="34" y="413" class="head">Keyboard</text><text x="34" y="438" class="hint">On-screen keyboard [ ON ]</text><rect x="18" y="476" width="248" height="82" rx="15" class="card"/><text x="34" y="507" class="head">Restart device</text><text x="34" y="532" class="hint">Confirmation required</text><text x="18" y="577" class="tiny">SWIPE EDGE TO RETURN · BOTTOM FOR CARDS</text></g>
<g transform="translate(1540 82)"><use href="#frame"/><rect x="8" y="22" width="268" height="74" rx="14" class="surface"/><rect x="18" y="34" width="5" height="51" rx="2" class="amber"/><text x="31" y="51" class="head">Network</text><text x="31" y="72" class="hint">Connection needs attention</text><text x="31" y="87" class="tiny">TAP TO OPEN · SHADE KEEPS HISTORY</text><text x="18" y="134" class="title">Editor</text><text x="18" y="155" class="hint">Focused app keeps keyboard input</text><rect x="18" y="181" width="248" height="182" rx="14" class="card"/><text x="34" y="215" class="body">Draft notes |</text><text x="34" y="247" class="hint">Preview does not take focus.</text><text x="18" y="389" class="tiny">KEYBOARD REGION OWNS TOUCH BELOW</text><rect x="0" y="406" width="284" height="210" rx="19" fill="#31434e"/><text x="18" y="433" class="hint">On-screen keyboard</text><g fill="#506873"><rect x="15" y="451" width="254" height="32" rx="5"/><rect x="15" y="492" width="254" height="32" rx="5"/><rect x="15" y="533" width="254" height="32" rx="5"/></g><text x="36" y="473" class="tiny">Q    W    E    R    T    Y    U    I    O    P</text><text x="46" y="514" class="tiny">A    S    D    F    G    H    J    K    L</text><text x="47" y="555" class="tiny">Z    X    C    V    B    N    M</text></g>
