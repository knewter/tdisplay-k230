<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="724" viewBox="0 0 1536 724" role="img" aria-label="Proposed handheld shell contact sheet: overview, apps, settings, notifications and keyboard conflict state">
  <defs>
    <clipPath id="windows-screen" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="284" height="616" rx="24"/></clipPath>
    <style>
      .bg{fill:#101822}.rail{fill:#1b2934}.card{fill:#263946}.accent{fill:#78d7cb}.text{fill:#f4f7f8}.sub{fill:#c8d7dd}.warn{fill:#ffc27a}.err{fill:#ffb2a8}.stroke{stroke:#78d7cb;stroke-width:2;fill:none}
      .label{font:700 20px sans-serif;fill:#f4f7f8}.t{font:700 21px sans-serif;fill:#f4f7f8}.h{font:700 16px sans-serif;fill:#f4f7f8}.b{font:14px sans-serif;fill:#f4f7f8}.s{font:12px sans-serif;fill:#c8d7dd}.micro{font:10px sans-serif;fill:#c8d7dd}.nav{font:700 11px sans-serif;fill:#f4f7f8}.num{font:700 11px sans-serif;fill:#101822}
    </style>
    <g id="frame"><rect width="284" height="616" rx="24" class="bg"/><rect x="0" y="0" width="284" height="40" rx="20" class="rail"/><rect x="0" y="22" width="284" height="18" class="rail"/><text x="14" y="25" class="nav">APPS</text><text x="75" y="25" class="nav">WINDOWS</text><text x="151" y="25" class="nav">KEYBOARD</text><text x="239" y="25" class="nav">SYSTEM</text><rect x="14" y="566" width="256" height="38" rx="13" class="rail"/><text x="30" y="590" class="nav">BACK</text><text x="209" y="590" class="nav">HOME</text></g>
  </defs>
  <rect width="1536" height="724" fill="#0a1017"/>
  <text x="20" y="34" class="label">HANDHELD SHELL / design study</text><text x="20" y="56" class="s">Proposed 568×1232 logical pixels · shown at 50% · not installed or physically verified</text>
  <g transform="translate(20 82)"><use href="#frame"/><text x="18" y="77" class="t">Windows</text><text x="18" y="98" class="s">2 open · swipe or tap a card</text><g clip-path="url(#windows-screen)"><rect x="236" y="153" width="84" height="270" rx="15" class="card"/><rect x="243" y="169" width="66" height="192" rx="8" fill="#182a33"/></g><rect x="18" y="124" width="208" height="328" rx="19" class="card"/><rect x="18" y="124" width="208" height="328" rx="19" class="stroke"/><rect x="32" y="140" width="180" height="245" rx="10" fill="#162a35"/><rect x="44" y="158" width="156" height="21" rx="5" fill="#304a57"/><text x="48" y="174" class="micro">Terminal · active</text><text x="44" y="220" class="micro">$ systemctl status shell</text><text x="44" y="243" class="micro">● active (running)</text><path d="M32 381h180" stroke="#42616b"/><text x="34" y="412" class="h">Terminal</text><text x="34" y="433" class="s">Tap to expand</text><rect x="18" y="466" width="248" height="54" rx="13" class="rail"/><text x="37" y="498" class="nav">APPS</text><text x="171" y="498" class="nav">NEXT CARD &gt;</text><text x="19" y="547" class="micro">HORIZONTAL LIVE DECK · UNVERIFIED</text></g>
  <g transform="translate(324 82)"><use href="#frame"/><text x="18" y="77" class="t">Apps</text><text x="18" y="98" class="s">Installed apps · page 1 of 2</text><rect x="18" y="124" width="248" height="84" rx="16" class="card"/><circle cx="53" cy="163" r="19" class="accent"/><text x="47" y="169" class="num">&gt;_</text><text x="84" y="160" class="h">New terminal</text><text x="84" y="181" class="s">Open a separate window</text><rect x="18" y="220" width="248" height="84" rx="16" class="card"/><circle cx="53" cy="259" r="19" fill="#ffc27a"/><text x="47" y="265" class="num">?</text><text x="84" y="256" class="h">Help</text><text x="84" y="277" class="s">Gestures and recovery</text><rect x="18" y="316" width="248" height="84" rx="16" class="card"/><circle cx="53" cy="355" r="19" fill="#78d7cb"/><text x="46" y="361" class="num">W</text><text x="84" y="352" class="h">Web</text><text x="84" y="373" class="s">Browse with the network</text><rect x="18" y="452" width="248" height="54" rx="13" class="rail"/><text x="33" y="484" class="nav">PREVIOUS</text><text x="205" y="484" class="nav">NEXT</text><text x="19" y="547" class="micro">DESKTOP ENTRY CATALOG</text></g>
  <g transform="translate(628 82)"><use href="#frame"/><text x="18" y="77" class="t">Settings</text><text x="18" y="98" class="s">Only controls this image supports</text><rect x="18" y="124" width="248" height="76" rx="15" class="card"/><text x="34" y="153" class="h">Network</text><text x="34" y="177" class="s">Status unavailable · Open setup ›</text><rect x="18" y="212" width="248" height="76" rx="15" class="card"/><text x="34" y="241" class="h">Display</text><text x="34" y="265" class="s">Brightness control unavailable</text><rect x="18" y="300" width="248" height="76" rx="15" class="card"/><text x="34" y="329" class="h">Motion</text><text x="34" y="353" class="s">Reduced motion  [ ON ]</text><rect x="18" y="388" width="248" height="76" rx="15" class="card"/><text x="34" y="417" class="h">Keyboard</text><text x="34" y="441" class="s">On-screen keyboard  [ ON ]</text><rect x="18" y="476" width="248" height="62" rx="15" class="rail"/><text x="34" y="501" class="h">Restart device</text><text x="34" y="523" class="s">Confirmation required</text></g>
  <g transform="translate(932 82)"><use href="#frame"/><text x="18" y="77" class="t">Notifications</text><text x="18" y="98" class="s">3 recent · no private preview text</text><rect x="18" y="124" width="248" height="98" rx="15" class="card"/><rect x="29" y="138" width="6" height="68" rx="3" class="warn"/><text x="45" y="154" class="h">Network</text><text x="45" y="174" class="s">Connection needs attention</text><rect x="43" y="182" width="99" height="28" rx="9" class="rail"/><rect x="148" y="182" width="106" height="28" rx="9" class="rail"/><text x="51" y="201" class="micro">OPEN SETUP</text><text x="166" y="201" class="micro">DISMISS</text><rect x="18" y="234" width="248" height="98" rx="15" class="card"/><rect x="29" y="248" width="6" height="68" rx="3" class="accent"/><text x="45" y="264" class="h">Browser</text><text x="45" y="284" class="s">New activity · details hidden</text><rect x="43" y="292" width="99" height="28" rx="9" class="rail"/><rect x="148" y="292" width="106" height="28" rx="9" class="rail"/><text x="51" y="311" class="micro">OPEN</text><text x="166" y="311" class="micro">DISMISS</text><rect x="18" y="344" width="248" height="98" rx="15" class="card"/><rect x="29" y="358" width="6" height="68" rx="3" class="accent"/><text x="45" y="374" class="h">System</text><text x="45" y="394" class="s">Update finished</text><rect x="43" y="402" width="99" height="28" rx="9" class="rail"/><rect x="148" y="402" width="106" height="28" rx="9" class="rail"/><text x="51" y="421" class="micro">VIEW</text><text x="166" y="421" class="micro">DISMISS</text><rect x="18" y="472" width="248" height="54" rx="13" class="rail"/><text x="36" y="504" class="nav">DISMISS ALL</text><text x="18" y="548" class="micro">A PREVIEW TIMES OUT; HISTORY STAYS</text></g>
  <g transform="translate(1236 82)"><use href="#frame"/><rect x="8" y="43" width="268" height="71" rx="14" class="rail"/><rect x="18" y="52" width="5" height="53" rx="2" class="warn"/><text x="31" y="68" class="h">Network</text><text x="31" y="88" class="s">Connection needs attention</text><text x="31" y="105" class="micro">TAP TO OPEN · HISTORY VIA SYSTEM</text><text x="18" y="145" class="t">Editor</text><text x="18" y="168" class="s">App text input retains focus</text><rect x="18" y="190" width="248" height="140" rx="13" class="card"/><text x="32" y="225" class="b">Draft notes |</text><text x="32" y="256" class="s">The preview does not take focus.</text><rect x="18" y="342" width="248" height="53" rx="13" class="rail"/><text x="32" y="374" class="nav">BACK</text><text x="208" y="374" class="nav">HOME</text><rect x="0" y="413" width="284" height="203" rx="19" fill="#31434e"/><text x="18" y="439" class="s">Keyboard · app focus retained</text><g fill="#506873"><rect x="15" y="457" width="254" height="32" rx="5"/><rect x="15" y="497" width="254" height="32" rx="5"/><rect x="15" y="537" width="254" height="32" rx="5"/></g><text x="38" y="479" class="nav">Q    W    E    R    T    Y    U    I    O    P</text><text x="43" y="519" class="nav">A    S    D    F    G    H    J    K    L</text><text x="39" y="559" class="nav">Z    X    C    V    B    N    M</text></g>
  <text x="20" y="712" class="s">Inspiration: Palm/HP phone webOS continuity and deferred notices. Original schematic; excludes Palm assets, battery claims, and shipping-state assertions.</text>
</svg>
