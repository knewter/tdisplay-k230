schema: spec-driven

context: |
  A LILYGO T-Display-K230: a Kendryte K230D (two RISC-V C908 cores at 1.6 GHz
  and 800 MHz, plus a KPU NPU) with 1 GiB LPDDR, a 4.1" 568x1232 RM69A10
  AMOLED, GT9895 touch, an RTL8189FTV SDIO radio and an SX1262/LR2021 LoRa
  radio. It arrived running LilyGO's RT-Smart firmware.

  The current goal is a practical touchscreen NixOS handheld, inspired by
  SXMO on the PinePhone Pro: Sway, readable terminals, an on-screen keyboard,
  desktop-entry app discovery, window switching and system controls. Preserve
  USB flashing and recovery; complete the boot splash after the shell works.
  AtomVM and the Dozer core are later work, outside this implementation goal.
  Read AGENTS.md for the integration workflow. Run `python3 tools/work-status.py`
  at task start and handoff; publish validated proposals on master early and
  land reviewed, proved task groups without waiting for unrelated work.
  Application defaults belong in this repo and the NixOS image. Fresh homes
  must provide the usable starting point; never rely on restoring home-directory
  state to preserve settings developed during bring-up.

  Terms specs should use:
    - stage 1        BootROM, U-Boot SPL with its DDR PMU training blob,
                     U-Boot 2022.10 and OpenSBI. SPL, U-Boot and OpenSBI
                     are built from pinned vendor source with local patches;
                     SPL retains identified DDR training blobs. BootROM is
                     in silicon. See docs/blob-inventory.md.
    - the system     the NixOS closure: kernel, initrd, rootfs
    - the console    the CH342 bridge on the charging USB-C, two CDC-ACM
                     ports at 115200 8N1
    - the panel      the RM69A10 AMOLED, driven through the kernel's
                     device-tree-configured panel-canaan-universal
    - the shell      the Sway/Pixman handheld session with Foot, a touch bar,
                     an on-screen keyboard and a desktop-entry launcher

  Say "vendored" for anything we take as a prebuilt binary from Canaan or
  LilyGO, and say who owns a boundary when a requirement crosses one.

  Toolchain: a pinned Nix flake. The system cross-compiles from x86_64-linux
  to riscv64-linux; riscv64 is community-tier in nixpkgs with no binary
  cache, so cross-compiling is the default and emulation is the fallback.
  QEMU's `k230` machine runs an image without hardware.

  Specs live under openspec/specs/ on the taxonomy in
  .skills/k230-spec-change/SKILL.md. Do not add a top-level group without
  proposing one.

rules:
  proposal:
    - State what stops working, or what a person cannot do, before naming any
      chip or register. Hardware writing slides into mechanism-first; invert
      it.
    - Name the non-goals. Scope creep is expensive here because one change
      can reach from a device tree to a Nix derivation to a running app.
    - Say whether the change needs the physical board. Work that runs under
      QEMU is worth separating from work that does not, because it can
      proceed while the board is in pieces.
  specs:
    - Ground every requirement in something observed on hardware, in a boot
      log, or in vendor source that has been read. Where none of those exist,
      mark it `<!-- UNVERIFIED -->` rather than writing a confident sentence.
      Datasheet prose is not grounding; a boot log is.
    - Write scenarios from the outside in. Say what a person at the board or
      at a console observes, not which driver probes.
    - Say which side owns it. A requirement met by vendored stage 1 is not a
      requirement on the system, and conflating them is how boot bugs hide.
  design:
    # Quoted because a colon-space in a plain scalar makes YAML read the
    # item as a map key, and an unparseable config is ignored in full rather
    # than complained about -- every rule in this file goes missing for one
    # line. ../truck carries the same comment for the same reason.
    - "Name the layer: stage 1, kernel, device tree, Nix, or userspace. A
      design that names only 'the image' has not said where the work lands."

    - Record what was rejected and why. Several dead ends here were expensive
      to find and cheap to re-enter.
  tasks:
    - Every task group ends with the command that proves it, and it is the
      narrowest real invocation -- a `nix build` of one derivation, a QEMU
      boot, or a named `tools/msh.py` invocation against the board.
    - Distinguish proof under QEMU from proof on hardware. Say which one a
      task claims; they are not interchangeable.
    - Keep a task to something completable in one sitting. A cross-compile
      without a binary cache is long; split by derivation, not by hope.

operations:
  apply:
    guidance:
      - Run the task group's own command before ticking its box, and never
        claim a hardware task passes from a QEMU run.
      - Capture the console output that proves a hardware task into
        docs/ rather than pasting it into a commit message. Boot logs are
        the evidence this project runs on.
      - Push reviewed proposals and finished task groups to master promptly,
        preserving unchecked tasks for unfinished behavior. Push unfinished
        implementation branches as checkpoints after reviewing their contents;
        a branch backup is not a landed feature. Follow AGENTS.md.
      - Work each change in its own git worktree, not in the shared
        checkout. Several agents run here at once and they have already
        swept each other's in-progress files into one another's commits.
        `git worktree add ../k230-<change-name> -b <change-name>`.
      # Quoted because YAML reserves a leading backtick in a plain scalar,
      # and an unparseable config is ignored in full rather than complained
      # about -- one bad line silently drops every instruction in this file.
      - "The board is a single shared resource and only one agent may hold
        /dev/ttyACM0. Concurrent opens fail as `device reports readiness to
        read but returned no data (device disconnected or multiple access on
        port?)`, which reads like a hardware fault and is not one. Say when
        you take the board and when you release it."
      - "Routine flashes write and verify boot; full-image readback is opt-in
        for flashing changes, suspected corruption, or an explicit user request."
      - "A device tree change does NOT need a reflash: `tools/push-file.py
        --src <dtb> --dest /boot/k230-tdisplay.dtb --reboot` moves it to the
        running board in about 11 seconds, and `nix build .#deviceTree`
        compiles a DTB without the kernel. Plan around that before costing
        anything as a 20 minute rebuild and a card swap."
  archive:
    guidance:
      - Say which capability files the delta touched.
      - Push the archive and verify the exact revision in CI and Pages.
        Report the commit, deployed URL, remaining open proposals, and any
        separate image or physical verification still required.
      - Fast-forward the shared checkout before you finish, since changes
        are applied in per-change worktrees and the shared directory's master
        is never pulled by anybody. From the shared checkout run
        `git fetch origin && git merge --ff-only origin/master`.
      # Quoted for the same reason as above.
      - "`--ff-only` rather than `pull`, because that checkout usually holds
        another agent's uncommitted work. It refuses instead of clobbering,
        and untracked files do not block it. If it refuses, say which paths
        are in the way and leave them alone; never stash, reset, or check
        out a path you did not create there."
      - "Check the delta's operation against what openspec/specs/ actually
        holds. `openspec archive` refuses a MODIFIED or RENAMED requirement
        whose target spec does not exist, and it refuses at archive time,
        after the work is done -- `system/kernel` was declared MODIFIED
        against a capability that had never existed."
      - If a requirement was grounded by a boot log, make sure that log is
        committed before the change is archived. A requirement whose evidence
        lives only in a terminal scrollback is unverified.
