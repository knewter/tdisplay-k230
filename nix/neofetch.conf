# Compact portrait defaults. Neofetch loads upstream defaults first; individual
# users may supply their own ~/.config/neofetch/config.conf instead.
print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Shell" shell
    info "Resolution" resolution
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
}
ascii_distro="nixos_small"
color_blocks="off"
# Keep the CPU/core count and distro inside the 568-pixel portrait terminal.
gap=1
distro_shorthand="on"
