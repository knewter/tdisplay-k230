[package]
name = "k230-shell-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Opt-in K230 handheld Rust shell client"

[dependencies]
libc = "=0.2.175"

# "xkbcommon" (not "calloop": the event loop here is a manual poll, not a
# calloop source) pulls in the seat::keyboard module -- SCTK gates it behind
# this feature because turning wl_keyboard keycodes into text needs a real
# libxkbcommon keymap. Needed so the Wi-Fi password field can take normal
# wl_keyboard input from the system keyboard instead of drawing its own
# keypad (openspec/changes/the-handheld-configures-wifi-from-settings).
smithay-client-toolkit = { version = "=0.20.0", default-features = false, features = ["xkbcommon"] }
wayland-client = "=0.31.11"
cairo-rs = { version = "=0.21.5", features = ["png"] }
pango = "=0.21.5"
pangocairo = "=0.21.5"
gio = "=0.21.5"
glib = "=0.21.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
