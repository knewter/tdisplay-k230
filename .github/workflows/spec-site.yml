# Build the spec site and publish it to GitHub Pages on every push to master,
# so https://knewter.github.io/tdisplay-k230/ says what the specs say.
#
# The build fails -- and so does this workflow -- when a requirement declares
# no verification status, cites evidence that is not committed, or the site
# breaks its time or size budget. See scripts/build_site.py.
name: Spec site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight and leave Pages
# serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Check the data pass
        run: python3 -m unittest discover -s tests -p 'test_render_specs.py'

      - name: Build the site
        run: python3 scripts/build_site.py

      # No actions/configure-pages: the base path is fixed in
      # site/astro.config.mjs, so there is nothing to read from the Pages
      # configuration, and letting it run would fail this whole job -- budgets
      # and assertions included -- over a repository setting.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
