# Build the spec site and publish it to GitHub Pages on every push to master,
# so https://knewter.github.io/tdisplay-k230/ says what the specs say.
#
# The build fails -- and so does this workflow -- when a requirement declares
# no verification status, cites evidence that is not committed, or the site
# breaks its time or size budget. See scripts/build_site.py.
name: Spec site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight and leave Pages
# serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq build-essential pkg-config libglib2.0-dev libwayland-dev libwayland-bin wayland-protocols libpango1.0-dev libcairo2-dev ffmpeg

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Check the data pass
        run: python3 -m unittest discover -s tests -p 'test_render_specs.py'

      - name: Check touch-menu protocol and actions
        run: python3 tests/test_touch_menu.py

      - name: Check root-growth guard and failure policy
        run: python3 tests/test_root_growth.py

      - name: Check booted-card-smoke proof protocol
        run: python3 tests/test_qemu_card_shell_smoke.py

      - name: Check window overview metadata
        run: python3 tests/test_window_catalog.py

      - name: Check launcher Help and application navigation
        run: python3 tests/test_launcher_navigation.py

      - name: Check unattended flash target refusals
        run: python3 -m unittest discover -s tests -p 'test_ums_target.py'

      - name: Check desktop catalogue discovery and launch arguments
        run: python3 tests/test_desktop_catalog.py

      - name: Check Wi-Fi runtime secret cleanup
        run: sudo bash tools/test-wifi-runtime-secret-procedure.sh

      - name: Check sampled-frame video encoding
        run: python3 tests/test_grim_samples.py

      - name: Check video lifecycle and presentation evidence
        run: python3 -m unittest discover -s tests -p 'test_video_*.py'

      - name: Build the site
        run: python3 scripts/build_site.py

      # No actions/configure-pages: the base path is fixed in
      # site/astro.config.mjs, so there is nothing to read from the Pages
      # configuration, and letting it run would fail this whole job -- budgets
      # and assertions included -- over a repository setting.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
