# Build stage 1 from source, the way the flake does, and keep the hashes.
#
# Stage 1 -- U-Boot SPL, U-Boot 2022.10, the environment, OpenSBI 1.4 -- is
# an ordinary Nix build over sources pinned by hash (nix/stage1.nix and the
# derivations it names). Nothing is published as a release any more: there
# is no binary to fetch, so nothing for nix/stage1.nix to pin. This
# workflow exists so that a change to the recipe is seen to build on a
# machine that is not the developer's, and so the SHA256SUMS of what it
# built are kept alongside the run.
#
# It is slow. riscv64 has no binary cache, so the cross toolchain builds
# from source on a cold runner. That is the cost of the derivation being
# ordinary rather than fixed-output, and it is paid here rather than on
# every developer's machine.
name: stage 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'nix/stage1.nix'
      - 'nix/uboot-k230.nix'
      - 'nix/uboot-k230-ums.config'
      - 'nix/patches/uboot-k230/**'
      - 'nix/opensbi-k230.nix'
      - 'nix/k230-sdk-src.nix'
      - 'firmware/stage1/tdisplay.env'
      - 'flake.lock'
      - '.github/workflows/stage1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 4

      - name: Build stage 1 from source
        run: |
          nix build --print-build-logs --out-link result-stage1 .#stage1

      - name: What was built
        run: |
          ls -l result-stage1/
          cat result-stage1/SHA256SUMS
          echo "fw_next_arg1 must pass the device tree through, not copy it (docs/evidence/opensbi-fdt-passthrough.txt):"
          nix shell nixpkgs#pkgsCross.riscv64.buildPackages.binutils \
            -c riscv64-unknown-linux-gnu-objdump -d "$(nix build --print-out-paths .#opensbi-k230)/fw_jump.elf" \
            | grep -A2 '<fw_next_arg1>:'

      - uses: actions/upload-artifact@v4
        with:
          name: stage1-sha256sums
          path: result-stage1/SHA256SUMS
