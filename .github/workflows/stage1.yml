# Build the K230 stage-1 firmware and publish it, so the binaries never live
# in git.
#
# nix/stage1.nix fetches the published archive by hash. Rebuilding is a
# deliberate act -- run this workflow, take the hash it prints, update
# nix/stage1.nix -- rather than something that happens silently on a push,
# because stage 1 is the part of the system that can leave a board unable to
# boot at all.
name: stage 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/gen-stage1.sh'
      - '.github/workflows/stage1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone the K230 Linux SDK
        run: |
          git clone --depth 1 -b dev \
            https://github.com/kendryte/k230_linux_sdk.git .build/k230_linux_sdk

      - name: Record what we are building from
        id: src
        run: |
          echo "sdk_commit=$(git -C .build/k230_linux_sdk rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Toolchain and dependencies
        working-directory: .build/k230_linux_sdk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential git wget curl file cpio unzip rsync bc python3 \
            python3-dev python3-pip python-is-python3 libncurses5-dev flex \
            bison libssl-dev device-tree-compiler mtools dosfstools genext2fs \
            u-boot-tools gawk fakeroot libyaml-dev libconfuse-dev
          sudo make toolchain_and_depend

      - name: Build U-Boot and OpenSBI
        working-directory: .build/k230_linux_sdk
        run: |
          make k230_canmv_v3_defconfig
          make uboot
          make opensbi

      - name: Assemble stage 1
        run: |
          .build/k230_linux_sdk/../../tools/gen-stage1.sh --no-docker || \
            tools/gen-stage1.sh --no-docker

      - name: Package
        id: pack
        run: |
          mkdir -p dist
          cp firmware/stage1/*.bin firmware/stage1/*.env dist/
          cp firmware/stage1/PROVENANCE.txt dist/
          tar -czf stage1.tar.gz -C dist .
          echo "sha256=$(sha256sum stage1.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "nixhash=$(nix-hash --type sha256 --flat --base32 stage1.tar.gz 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: What to paste into nix/stage1.nix
        run: |
          echo "SDK commit : ${{ steps.src.outputs.sdk_commit }}"
          echo "sha256     : ${{ steps.pack.outputs.sha256 }}"
          sha256sum dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: stage1
          path: stage1.tar.gz

      - name: Publish a release when the recipe changed
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stage1-${{ github.sha }}
          files: stage1.tar.gz
          body: |
            K230 stage-1 firmware.

            SDK commit: ${{ steps.src.outputs.sdk_commit }}
            config:     k230_canmv_v3_defconfig
            sha256:     ${{ steps.pack.outputs.sha256 }}

            Point nix/stage1.nix at this asset's URL and hash.
